[package]
name = "mct-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
autobins = false

[package.metadata]
cargo-fuzz = true

[features]
# Keep existing daemon targets enabled by default; ledger/kernel fuzzing can
# avoid unrelated Iroh cdylib instrumentation via --no-default-features.
default = ["daemon"]
daemon = ["dep:mct-daemon"]

[dependencies]
libfuzzer-sys = "0.4"
mct-kernel = { path = "../crates/mct-kernel" }
mct-observation = { path = "../crates/mct-observation" }
serde_json = "1"
mct-daemon = { path = "../crates/mct-daemon", features = ["fuzzing"], optional = true }

[lib]
path = "src/lib.rs"

[workspace]
members = ["."]

[[bin]]
name = "ledger_continuity"
path = "fuzz_targets/ledger_continuity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admin_genesis"
path = "fuzz_targets/admin_genesis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admin_issuance"
path = "fuzz_targets/admin_issuance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guardian_recovery"
path = "fuzz_targets/guardian_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uds_control_request"
required-features = ["daemon"]
path = "fuzz_targets/uds_control_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_archive"
required-features = ["daemon"]
path = "fuzz_targets/release_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "child_package_manifest"
required-features = ["daemon"]
path = "fuzz_targets/child_package_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_dispatch"
required-features = ["daemon"]
path = "fuzz_targets/call_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pando_manifest"
required-features = ["daemon"]
path = "fuzz_targets/pando_manifest.rs"
test = false
doc = false
bench = false
