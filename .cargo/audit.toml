# R2 dependency-audit policy: every vulnerability and every non-exempt warning fails CI.
#
# Each ignore entry needs comment keys on the lines directly above its id:
#   reason:       why the advisory is ignored
#   revisit-by:   YYYY-MM-DD, flagged by the nightly audit once the date has passed
#   revisit-when: a condition that should drop the ignore earlier than the date
# An entry must have a reason and at least one of revisit-by or revisit-when.
[advisories]
ignore = [
    # reason: Transitive Linux netlink proc-macro; no maintained release is available in the current netdev/netwatch chain.
    # revisit-by: 2027-04-14
    # revisit-when: the Iroh network stack advances
    "RUSTSEC-2024-0436",
    # reason: proc-macro-error2 (unmaintained) via libcrux-ml-dsa -> core-models -> hax-lib-macros, only under cfg(hax); never compiled in our builds, present in Cargo.lock only.
    # revisit-by: 2027-04-14
    # revisit-when: libcrux-ml-dsa drops core-models/hax-lib 0.3, or hax-lib-macros drops proc-macro-error2
    "RUSTSEC-2026-0173",
]
informational_warnings = ["unmaintained", "unsound"]

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
# futures-buffered 0.2.13 requires spin ^0.10 and 0.10.0 is the only release in
# that series. Keep the lock exact and revisit with the next n0-future/Iroh refresh.
enabled = false
update_index = true
