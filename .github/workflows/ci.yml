name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [patina, main, master]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo fmt --check
        run: bash scripts/ci-tier0.sh fmt

  clippy:
    name: clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo clippy
        run: bash scripts/ci-tier0.sh clippy

  test:
    name: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Supervisor tests copy the daemon binary into private fixtures. Full DWARF
      # exhausted the hosted runner disk; keep assertions/unwind/test selection,
      # but use the same no-debuginfo profile validated locally.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Disk budget before tests
        run: df -h . "$RUNNER_TEMP"

      - name: cargo test
        run: bash scripts/ci-tier0.sh test

      - name: Disk budget after tests
        if: always()
        run: |
          df -h . "$RUNNER_TEMP"
          du -sh target 2>/dev/null || true

  specs:
    name: vocabulary, release, docs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Vocabulary and release checks
        run: bash scripts/ci-tier0.sh specs

      - name: Install documentation tools
        run: scripts/install-docs-tools.sh

      - name: Build and check product and API documentation
        run: scripts/build-docs.sh

  ledger-benchmark:
    name: Ledger open benchmark
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Streaming ledger open at 10k and 100k
        run: cargo run -p mct-observation --release --bin ledger-bench -- --sizes 10000,100000 --check

  audit:
    name: audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-audit: "true"

      - name: Check ignore metadata
        run: |
          python3 scripts/check-audit-ignores.py --self-test
          python3 scripts/check-audit-ignores.py
          bash scripts/ci-audit.sh --self-test

      - name: Audit dependency changes
        env:
          AUDIT_EVENT: ${{ github.event_name }}
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-audit.sh changed --event "$AUDIT_EVENT" "$AUDIT_BASE" "$AUDIT_HEAD"

  osv-scan:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner v2.7.0
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan lockfiles
        run: |
          python3 scripts/test-scan-osv.py
          python3 scripts/scan-osv.py "$RUNNER_TEMP/osv-scanner"

  dependency-audit:
    name: nightly dependency audit
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          install-audit: "true"

      - name: Strict audit
        id: strict-audit
        run: |
          set +e
          python3 scripts/check-audit-ignores.py --overdue > "$RUNNER_TEMP/ignores.txt" 2>&1
          ignore_status=$?
          cat "$RUNNER_TEMP/ignores.txt"
          bash scripts/ci-audit.sh strict > "$RUNNER_TEMP/audit.txt" 2>&1
          audit_status=$?
          cat "$RUNNER_TEMP/audit.txt"
          if [[ $ignore_status -ne 0 || $audit_status -ne 0 ]]; then
            exit 1
          fi

      - name: Open or update the dependency advisories issue
        if: failure() && steps.strict-audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-dependency-advisory-issue.sh "$RUNNER_TEMP/audit.txt" "$RUNNER_TEMP/ignores.txt"
