name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tier-1-specs-and-rust:
    name: Tier 1 — Allium specs and Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Allium
        run: scripts/install-allium-ci.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Install documentation tools
        run: scripts/install-docs-tools.sh

      - name: Check Allium specs and Rust tests
        run: scripts/ci-tier0.sh

      - name: Build and check product and API documentation
        run: scripts/build-docs.sh

  ledger-benchmark:
    name: Ledger open benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Streaming ledger open at 10k and 100k
        run: cargo run -p mct-observation --release --bin ledger-bench -- --sizes 10000,100000 --check
