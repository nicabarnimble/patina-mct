[workspace]
members = [
    "crates/mct-kernel",
    "crates/mct-observation",
    "crates/mct-iroh",
    "crates/mct-daemon",
    "crates/mct-trace",
    "crates/phase3-measure",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicabarnimble/patina-mct"

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
blake3 = "1.8.3"
const-hex = { version = "=1.19.3", default-features = false, features = ["alloc"] }
ed25519-dalek = "=3.0.0"
flate2 = "1.1.5"
getrandom = "0.3.4"
jiff = "0.2.15"
libcrux-ml-dsa = { version = "=0.0.11", default-features = false }
ml-dsa = "=0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tar = "0.4.44"
toml = "0.8.23"
tempfile = "3.23.0"
wasmtime = "48.0.6"
wasmtime-wasi = "48.0.6"
wat = "1.241.2"
zstd = "0.14.3"

# Size-oriented release profile. Panic stays unwind: wasmtime catches
# host-function panics with catch_unwind, and abort would turn those into
# process aborts. Thin LTO plus one codegen unit and symbol stripping
# shrink mct-daemon without a fat-LTO link.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
