[workspace]
members = [
    "crates/mct-kernel",
    "crates/mct-observation",
    "crates/mct-iroh",
    "crates/mct-daemon",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicabarnimble/patina-mct"

[workspace.dependencies]
anyhow = "1.0.103"
base64 = "0.23.1"
blake3 = "1.8.3"
flate2 = "1.1.5"
getrandom = "0.4.3"
jiff = "0.2.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tar = "0.4.44"
toml = "0.9.12"
tempfile = "3.23.0"
wasmtime = "48.0.5"
wasmtime-wasi = "49.0.2"
wat = "1.241.2"
